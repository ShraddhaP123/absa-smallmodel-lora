# Evaluates the Session 3 LoRA adapter (checkpoints/lora-r8) against the same
# scorer used for the Claude Sonnet 5 baseline. Must run on the GPU (Kaggle) —
# checkpoints/lora-r8 only exists there.

name: lora-r8-eval
backend: hf
domain: restaurants
split: test
prompt_template: variants/prompts/absa_extract.txt
max_new_tokens: 256
temperature: 0.0
hardware: T4

hf:
  base_model: HuggingFaceTB/SmolLM2-1.7B-Instruct
  lora_adapter: checkpoints/lora-r8
  quantization: null
  device: cuda
