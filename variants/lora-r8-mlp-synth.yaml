# Session 5: identical to lora-r8-mlp.yaml (Session 4's best config so far)
# in every respect except one addition -- 290 synthetic training examples
# targeting the specific gap Session 4 surfaced (sentiment_acc lagging
# aspect_f1 relative to Sonnet), generated by generate_synthetic.py to
# specifically cover conflict polarity, sarcasm, ambiguous-neutral, and
# understatement cases. See results/notes.md for the real vs. synthetic
# class-balance numbers that motivated this (conflict was 2.4% of real
# training aspects).
#
# Everything else (rank, alpha, target_modules, epochs, learning rate) is
# held constant from lora-r8-mlp.yaml on purpose -- this isolates "does
# adding this data help" as the one variable under test.

name: lora-r8-mlp-synth
base_model: HuggingFaceTB/SmolLM2-1.7B-Instruct
domain: restaurants
train_split: train
val_split: val
extra_train_files: [data/processed/restaurants_synthetic.jsonl]
prompt_template: variants/prompts/absa_extract.txt
max_seq_length: 512
output_dir: checkpoints/lora-r8-mlp-synth

lora:
  r: 8
  alpha: 16
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

training:
  epochs: 3
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4
  warmup_ratio: 0.03
  lr_scheduler_type: cosine
  logging_steps: 10
  seed: 42
