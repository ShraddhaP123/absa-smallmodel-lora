# Session 4 ablation: identical to lora-r8.yaml in every respect except
# target_modules — this adds LoRA to the MLP (feedforward) layers on top
# of the attention projections, isolating whether MLP adaptation helps
# close the sentiment_acc gap found in Session 3 (0.803 vs Sonnet's 0.874).
# Do not change anything else in this file; that's the whole point of an
# ablation — one variable, everything else held constant.

name: lora-r8-mlp
base_model: HuggingFaceTB/SmolLM2-1.7B-Instruct
domain: restaurants
train_split: train
val_split: val
prompt_template: variants/prompts/absa_extract.txt
max_seq_length: 512
output_dir: checkpoints/lora-r8-mlp

# Only line that differs from lora-r8.yaml: target_modules now also
# includes gate_proj/up_proj/down_proj (the MLP block from the transformer
# diagram) alongside the same attention projections, rank, and alpha.
lora:
  r: 8
  alpha: 16
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

training:
  epochs: 3
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4
  warmup_ratio: 0.03
  lr_scheduler_type: cosine
  logging_steps: 10
  seed: 42
